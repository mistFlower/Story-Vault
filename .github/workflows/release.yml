name: Release

# main 에 앱 소스가 바뀌면 빌드해서 릴리스한다.
# 원고(vault/)와 문서만 바뀐 커밋은 앱과 무관하므로 빌드하지 않는다.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'vault/**'
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

# 릴리스가 겹치지 않게 한 번에 하나만 돈다.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  release:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # 커밋마다 버전을 올려야 업데이터가 새 버전으로 인식한다.
      # run_number 는 단조 증가하므로 패치 번호로 그대로 쓴다.
      - name: 버전 결정
        id: version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e "
            const fs = require('fs');
            for (const f of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = '$VERSION';
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
            const toml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8')
              .replace(/^version = \".*\"/m, 'version = \"$VERSION\"');
            fs.writeFileSync('src-tauri/Cargo.toml', toml);
          "
          echo "빌드 버전: $VERSION"

      - name: 빌드 및 릴리스
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Story Vault v${{ steps.version.outputs.version }}
          releaseBody: |
            ${{ github.event.head_commit.message }}

            ---
            실행 중인 Story Vault 는 다음 실행 시 이 버전으로 자동 업데이트됩니다.
          releaseDraft: false
          prerelease: false
          # latest.json 을 릴리스에 첨부해야 업데이터가 새 버전을 찾을 수 있다.
          includeUpdaterJson: true
